<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <span class="header-icon">🎓</span>
            <div class="header-title">
                <h1>Student Management System</h1>
                <p class="header-subtitle">Add, view, and manage student records</p>
            </div>
            <div class="header-user">
                <span class="user-label" id="userLabel"></span>
                <button class="btn-logout" onclick="doLogout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="main-content">

        <section class="card form-card">

            <div class="card-header">
                <span class="card-icon">➕</span>
                <h2>Add New Student</h2>
            </div>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="e.g. Riya Sharma"
                    maxlength="100"
                    autocomplete="off"
                />
            </div>

            <div class="form-group">
                <label for="studentMarks">Marks Obtained <span class="label-hint">(out of 100)</span></label>
                <input
                    type="number"
                    id="studentMarks"
                    placeholder="e.g. 78"
                    min="0"
                    max="100"
                    step="0.01"
                />
            </div>

            <div class="grade-preview" id="gradePreview">
                <span class="preview-label">Grade preview:</span>
                <span class="preview-badge" id="previewBadge">—</span>
            </div>

            <button class="btn btn-primary" id="addBtn" onclick="addStudent()">
                Add Student
            </button>

            <div class="form-message" id="formMessage"></div>

        </section>

        <section class="card table-card">

            <div class="card-header">
                <span class="card-icon">📋</span>
                <h2>Student Records</h2>
                <span class="record-count" id="recordCount">0 students</span>
            </div>

            <div class="table-wrapper">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student Name</th>
                            <th>Marks</th>
                            <th>Percentage</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>

                <div class="empty-state" id="emptyState">
                    <span class="empty-icon">📭</span>
                    <p>No student records yet.<br>Add one using the form.</p>
                </div>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
