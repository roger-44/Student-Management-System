<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Student Management System</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-header">
                <span class="login-icon">🎓</span>
                <h1>Create an Account</h1>
                <p>Register to access the system</p>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Min. 3 characters"
                    autocomplete="username"
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Min. 6 characters"
                        autocomplete="new-password"
                    />
                    <button class="toggle-pw" type="button" onclick="togglePassword('password')">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                    />
                    <button class="toggle-pw" type="button" onclick="togglePassword('confirmPassword')">👁</button>
                </div>
            </div>

            <div class="login-error" id="errorBox"></div>
            <div class="register-success" id="successBox"></div>

            <button class="btn-login" id="registerBtn" onclick="doRegister()">
                Create Account
            </button>

            <p class="auth-switch">Already have an account? <a href="/login.html">Sign in here</a></p>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
