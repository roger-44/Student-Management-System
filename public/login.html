<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Student Management System</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-header">
                <span class="login-icon">🎓</span>
                <h1>Student Management System</h1>
                <p>Sign in to continue</p>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    />
                    <button class="toggle-pw" id="togglePw" type="button" onclick="togglePassword()">👁</button>
                </div>
            </div>

            <div class="login-error" id="loginError"></div>

            <button class="btn-login" id="loginBtn" onclick="doLogin()">
                Sign In
            </button>

            <p class="auth-switch">Don't have an account? <a href="/register.html">Register here</a></p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
